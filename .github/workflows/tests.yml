# ClimPilot — batterie complète à chaque push et chaque demande de fusion (P0, 21/10/2026).
# Aucun secret : les tests sont hors réseau (serveur simulé), SQL sur un PostgreSQL local du runner, validateurs clonés.
# Le rapport (rapport.md / rapport.json / journaux) est joint à chaque exécution (onglet Actions › artefacts).
# Protection de « main » (fusion interdite si rouge) : à activer par Gabriel dans Settings › Branches, règle « tests ».
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.nom }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Deux travaux : la batterie complète SANS la suite Q (bloquante pour « main »), et la suite Q seule — recette deux appareils,
    # chronométrée, instable sur machine chargée (M0, 20/10/2026) — jouée à part, visible, non bloquante (continue-on-error).
    # Ce n'est pas un masquage : son résultat est dans le résumé et l'artefact ; elle est à stabiliser (REFONTE-PLAN, P3).
    continue-on-error: ${{ matrix.non_bloquant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: batterie complète (sans suite Q)
            suites: ''
            sans_q: '1'
            non_bloquant: false
          - nom: suite Q — recette deux appareils (instable, non bloquante)
            suites: suiteQ-recette
            sans_q: '0'
            non_bloquant: true
    env:
      CP_TEST_OUT: ${{ github.workspace }}/../climpilot-tests
      PLAYWRIGHT_VERSION: 1.56.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Playwright + Chromium (version épinglée, tests/LISEZMOI.md)
        run: |
          npm i -g playwright@${PLAYWRIGHT_VERSION}
          npx playwright@${PLAYWRIGHT_VERSION} install --with-deps chromium

      - name: Modules Python (validateurs, SQL)
        run: pip install pytest==9.1.1 "psycopg[binary]==3.3.6" factur-x==7.1 lxml==6.1.3 saxonche==13.0.0

      - name: Validateurs CEN EN 16931 et FNFE BR-FR (versions épinglées)
        run: |
          git clone -q --depth 1 --branch validation-1.3.16 https://github.com/ConnectingEurope/eInvoicing-EN16931 "$RUNNER_TEMP/eInvoicing-EN16931"
          git clone -q --depth 1 --branch v1.4.0.04 https://github.com/fnfempe/France_RFE "$RUNNER_TEMP/France_RFE"
          echo "EN16931_XSLT=$RUNNER_TEMP/eInvoicing-EN16931/cii/xslt/EN16931-CII-validation.xslt" >> "$GITHUB_ENV"
          echo "BRFR_DIR=$RUNNER_TEMP/France_RFE" >> "$GITHUB_ENV"

      - name: PostgreSQL local (marqueur climpilot-test, socket seulement, aucune écoute réseau)
        run: |
          set -x
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16; fi
          sudo systemctl stop postgresql 2>/dev/null || true
          D=/tmp/climpilot-pg; sudo mkdir -p "$D"; sudo chown postgres:postgres "$D"; sudo chmod 755 "$D"
          sudo -u postgres /usr/lib/postgresql/16/bin/initdb -D "$D/data" -U postgres --auth=trust
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_ctl -D "$D/data" -l "$D/log.txt" -w start -o "-p 54329 -k $D -c listen_addresses= -c cluster_name=climpilot-test"
          psql -h "$D" -p 54329 -U postgres -tAc "show cluster_name"
          echo "PGHOST=$D" >> "$GITHUB_ENV"; echo "PGPORT=54329" >> "$GITHUB_ENV"

      - name: Isolation réseau (unshare -n) disponible ?
        id: netns
        run: |
          if unshare -n true 2>/dev/null; then echo "sans=0" >> "$GITHUB_OUTPUT"; echo "unshare -n : OUI";
          else echo "sans=1" >> "$GITHUB_OUTPUT"; echo "unshare -n : NON — gardes logicielles seulement (CP_SANS_NETNS=1, indiqué dans le rapport)"; fi

      - name: Batterie (tests/run-all.sh)
        id: batterie
        env:
          CP_SANS_NETNS: ${{ steps.netns.outputs.sans }}
          CP_SANS_Q: ${{ matrix.sans_q }}
          CP_SUITES: ${{ matrix.suites }}
        run: |
          set +e; bash tests/run-all.sh; code=$?; echo "code=$code" >> "$GITHUB_OUTPUT"; exit $code

      # Le rapport est aussi publié dans l'onglet « Checks » du commit (lisible depuis l'API, sans télécharger l'artefact).
      # GITHUB_TOKEN est fourni automatiquement par GitHub Actions : ce n'est pas un secret à poser.
      - name: Rapport dans les Checks du commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NOM: ${{ matrix.nom }}
          CODE: ${{ steps.batterie.outputs.code }}
        run: |
          R="$CP_TEST_OUT/rapport.md"; T="$RUNNER_TEMP/check.txt"
          { if [ -f "$R" ]; then sed -n '1,/^## Isolation/p' "$R"; else echo "PAS DE RAPPORT (batterie interrompue, code de sortie ${CODE:-?})"; fi
            echo; echo '## Codes de sortie par étape'; cat "$CP_TEST_OUT/codes.txt" 2>/dev/null || echo '(aucun)'
            echo; echo '## Fin des journaux des étapes en échec'
            if [ -f "$CP_TEST_OUT/codes.txt" ]; then while read -r n c d; do [ "$c" != 0 ] && { echo "### $n (code $c)"; tail -n 25 "$CP_TEST_OUT/journaux/$n.log" 2>/dev/null | cut -c1-400; }; done < "$CP_TEST_OUT/codes.txt"; fi
            echo; echo '## Journal du serveur local'; tail -n 5 "$CP_TEST_OUT/journaux/serveur-8765.log" 2>/dev/null
            ls -la "$CP_TEST_OUT" 2>/dev/null | head -20; } > "$T" 2>&1
          head -c 60000 "$T" > "$T.court"
          jq -n --arg nom "tests — $NOM" --arg sha "$GITHUB_SHA" --arg concl "$( [ "${CODE:-1}" = 0 ] && echo success || echo failure )" --arg titre "batterie ClimPilot (code ${CODE:-?})" --rawfile txt "$T.court" \
            '{name:$nom, head_sha:$sha, status:"completed", conclusion:$concl, output:{title:$titre, summary:"Rapport de tests/run-all.sh (sans secret).", text:$txt}}' \
            | gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - >/dev/null && echo "check-run publié" || echo "publication du check-run impossible (droits ?)"

      - name: Résumé
        if: always()
        run: |
          if [ -f "$CP_TEST_OUT/rapport.md" ]; then sed -n '1,/^## Isolation/p' "$CP_TEST_OUT/rapport.md" >> "$GITHUB_STEP_SUMMARY"; else echo "pas de rapport (batterie interrompue)" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Rapport et journaux (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-${{ github.run_number }}-${{ strategy.job-index }}
          path: |
            ${{ env.CP_TEST_OUT }}/rapport.md
            ${{ env.CP_TEST_OUT }}/rapport.json
            ${{ env.CP_TEST_OUT }}/journaux/
            ${{ env.CP_TEST_OUT }}/golden/
          if-no-files-found: warn
          retention-days: 30
